version: 1
metadata:
  ota:
    minimum_version: "1.6.19"
# Pressure-test note (local branch):
# - Remove `setup` and the `uv run`-backed verification path before an upstream PR unless the
#   widened uv-managed environment lane is fully proven in matrix and we want to claim more than
#   parser-level source compilation.
project:
  name: airflow
  description: Airflow readiness slice covering uv-managed Python environment hydration and source compilation checks
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      only_arch:
        - x64
      lifecycle: ephemeral
      container:
        image: ghcr.io/apache/airflow/main/ci/python3.10
        engines:
          - docker
          - podman
      attachments:
        isolated_paths:
          - .venv
          - .uv-cache
toolchains:
  python:
    provider: uv
    version: '3.10'
    package_managers:
      uv: '>=0.11.8'
tasks:
  setup:
    context: host
    category: setup
    description: Sync the Airflow development environment with uv.
    run: uv sync
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: uv sync
        container:
          context: app
          run: uv sync
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .venv
        - .uv-cache
      network: true
      network_kind: dependency_hydration
    notes: |
      Sync the repo-managed uv environment using the development path documented in `INSTALL`.
      This is a widened pressure-test lane intended to exercise toolchain fulfillment and
      dependency-hydration behavior rather than just parser-level source checks.
    internal: true
  test:
    context: host
    category: test
    description: Compile Airflow core sources inside the uv-managed environment.
    run: uv run python -m compileall -q airflow-core/src/airflow
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: uv run python -m compileall -q airflow-core/src/airflow
        container:
          context: app
          run: uv run python -m compileall -q airflow-core/src/airflow
    depends_on:
      - setup
    requirements:
      toolchains:
        - python
    notes: |
      Validate source-level Python compatibility from the repo-managed uv environment rather than a
      bare interpreter-only path.
  verify:
    context: host
    category: test
    description: Aggregate baseline Airflow verification checks.
    run: "true"
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: "true"
        container:
          context: app
          run: "true"
    depends_on:
      - test
    requirements:
      toolchains:
        - python
    safe_for_agent: true
    notes: |
      Contract-level verification path for this Airflow slice.
      Because this path now depends on uv environment hydration, it is a broader pressure lane than
      the previous compile-only baseline.
workflows:
  default: verify
  verify:
    description: Canonical Airflow verification path for this contract slice.
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to run the declared baseline verification path.
agent:
  posture: readiness_strict
  entrypoint: test
  default_task: verify
  safe_tasks:
  - verify
  verify_after_changes:
  - verify
  writable_paths:
  - .uv-cache
  - .venv
  - airflow-core
  - airflow-ctl
  - airflow-ctl-tests
  - airflow-e2e-tests
  - chart
  - clients
  - dev
  - devel-common
  - docker-stack-docs
  - docker-tests
  - docs
  - java-sdk
  - kubernetes-tests
  - performance
  - providers
  - providers-summary-docs
  - scripts
  - shared
  - task-sdk
  - task-sdk-integration-tests
  protected_paths:
  - .github/workflows
  - ota.yaml
  - uv.lock
  inferred_boundary:
    reviewed: true
    provenance:
      writable_paths:
      - init:common_source_roots
      - init:stack_source_scan
      protected_paths:
      - init:contract_file_default
      - init:stack_companion_control_files
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.19 sh
      powershell: $env:OTA_VERSION='v1.6.19'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Use `ota workflows` to inspect declared workflow paths.
    Use `ota up --workflow verify` when you want setup and verification through one declared path.
    Use `ota tasks --safe --use` to inspect the approved agent task surface before execution.
    Use `ota validate` before changes and `ota doctor` after edits.
    Use `ota run verify` for the contract verification path.
    This local pressure branch widens Airflow from bare compile checks to a uv-managed environment
    path; remove that broader claim before PR unless the widened lane stays green in matrix.
