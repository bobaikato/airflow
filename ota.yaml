version: 1
metadata:
  ota:
    minimum_version: "1.6.19"
project:
  name: airflow
  description: Airflow readiness slice covering Python runtime/tooling sanity and source compilation checks
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      only_arch:
        - x64
      lifecycle: ephemeral
      container:
        image: python:3.12-bookworm
        engines:
          - docker
          - podman
      attachments:
        isolated_paths:
          - .venv
          - .uv-cache
toolchains:
  python:
    provider: uv
    version: '3.12'
tasks:
  setup:
    context: host
    category: setup
    description: Ensure the pinned Python tooling is available.
    run: python -m pip install --disable-pip-version-check -q uv
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: python -m pip install --disable-pip-version-check -q uv
        container:
          context: app
          run: python -m pip install --disable-pip-version-check -q uv
    effects:
      network: true
      network_kind: dependency_hydration
    notes: Install uv if needed for this contract slice.
    internal: true
  test:
    context: host
    category: test
    description: Compile Airflow core sources to validate parser/runtime compatibility.
    run: python -m compileall -q airflow-core/src/airflow
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: python -m compileall -q airflow-core/src/airflow
        container:
          context: app
          run: python -m compileall -q airflow-core/src/airflow
    depends_on:
      - setup
    safe_for_agent: true
    notes: This slice validates source-level Python compatibility without full extras hydration.
  verify:
    category: test
    description: Aggregate baseline Airflow verification checks.
    aggregate:
      tasks:
        - test
    safe_for_agent: true
    notes: Contract-level verification path for this Airflow slice.
workflows:
  default: verify
  verify:
    description: Canonical Airflow verification path for this contract slice.
    setup:
      task: setup
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to run the declared setup plus baseline verification sequence.
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks:
  - test
  - verify
  verify_after_changes:
  - verify
  writable_paths:
  - airflow-core
  - airflow-ctl
  - airflow-ctl-tests
  - airflow-e2e-tests
  - chart
  - clients
  - dev
  - devel-common
  - docker-stack-docs
  - docker-tests
  - docs
  - java-sdk
  - kubernetes-tests
  - performance
  - providers
  - providers-summary-docs
  - scripts
  - shared
  - task-sdk
  - task-sdk-integration-tests
  protected_paths:
  - .github/workflows
  - ota.yaml
  - uv.lock
  inferred_boundary:
    reviewed: true
    provenance:
      writable_paths:
      - init:common_source_roots
      - init:stack_source_scan
      protected_paths:
      - init:contract_file_default
      - init:stack_companion_control_files
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_GIT_REV=08c270351c9870c82a39899161388bb250ad23c4 sh -s -- --from-git
      powershell: $env:OTA_GIT_REV='08c270351c9870c82a39899161388bb250ad23c4'; & ([scriptblock]::Create((irm https://dist.ota.run/install.ps1))) -FromGit
  notes: |
    Use `ota workflows` to inspect declared workflow paths.
    Use `ota up --workflow verify` when you want setup and verification through one declared path.
    Use `ota tasks --safe --use` to inspect the approved agent task surface before execution.
    Use `ota validate` before changes and `ota doctor` after edits.
    Use `ota run verify` for the contract verification path.
